<!doctype html>
<html lang="ru">
<head>

  <style>
    html, body {
      background: #1f1817;
      color: #f7edec;
      margin: 0;
      min-height: 100%;
    }
    body {
      font: 16px/1.5 Georgia, "Times New Roman", serif;
    }
    main {
      box-sizing: border-box;

      padding: 16px;

    figure {

    img {
      display: block;
      height: auto;
      margin: 0 auto;
      max-width: 100%;
    }
    figcaption {
      margin-top: 12px;
      text-align: center;
      word-break: break-all;
    }
    a {
      color: #ffe6cf;
    }
  </style>
</head>
<body>
  <main>
    <figure>
      <img alt="Example.jpg" src="Example.jpg"/>
      <figcaption><a href="Example.jpg">Открыть исходный файл</a></figcaption>
    </figure>
  </main>
