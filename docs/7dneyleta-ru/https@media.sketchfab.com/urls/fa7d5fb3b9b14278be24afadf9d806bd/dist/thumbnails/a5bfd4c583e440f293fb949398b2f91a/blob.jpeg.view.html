<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>https@media.sketchfab.com/urls/fa7d5fb3b9b14278be24afadf9d806bd/dist/thumbnails/a5bfd4c583e440f293fb949398b2f91a/blob.jpeg</title>
  <style>
    html, body {
      background: #1f1817;
      color: #f7edec;
      margin: 0;
      min-height: 100%;
    }
    body {
      font: 16px/1.5 Georgia, "Times New Roman", serif;
    }
    main {
      box-sizing: border-box;
      min-height: 100vh;
      padding: 16px;
    }
    figure {
      margin: 0 auto;
      max-width: min(100vw - 32px, 1400px);
    }
    img {
      display: block;
      height: auto;
      margin: 0 auto;
      max-width: 100%;
    }
    figcaption {
      margin-top: 12px;
      text-align: center;
      word-break: break-all;
    }
    a {
      color: #ffe6cf;
    }
  </style>
</head>
<body>
  <main>
    <figure>
      <img alt="blob.jpeg" src="blob.jpeg"/>
      <figcaption><a href="blob.jpeg">Открыть исходный файл</a></figcaption>
    </figure>
  </main>
</body>
</html>
