<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Архив форумов «7 дней лета»</title>
  <style>
    :root {
      color-scheme: light;
    }
    * {
      box-sizing: border-box;
    }
    body {
      background:
        radial-gradient(circle at top, rgba(255, 237, 214, 0.85), rgba(255, 237, 214, 0) 38%),
        linear-gradient(180deg, #f3e4da 0%, #f7f1ea 44%, #fbf8f5 100%);
      color: #4d382f;
      font: 16px/1.6 Georgia, "Times New Roman", serif;
      margin: 0;
      min-height: 100vh;
    }
    main {
      margin: 0 auto;
      max-width: 920px;
      padding: 48px 20px 72px;
    }
    .card {
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(150, 110, 87, 0.18);
      box-shadow: 0 24px 60px rgba(82, 57, 46, 0.12);
      padding: 32px;
    }
    h1 {
      color: #7b2d26;
      font-size: clamp(30px, 4vw, 42px);
      line-height: 1.12;
      margin: 0 0 16px;
    }
    p {
      margin: 0 0 16px;
    }
    .grid {
      display: grid;
      gap: 16px;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      margin: 28px 0 20px;
    }
    .site-card {
      background: #fffaf6;
      border: 1px solid #ead8cd;
      padding: 18px 18px 20px;
    }
    .site-card h2 {
      color: #69342d;
      font-size: 22px;
      line-height: 1.2;
      margin: 0 0 10px;
    }
    .site-card p {
      color: #634f47;
      font-size: 15px;
      margin-bottom: 14px;
    }
    a.site-button {
      background: #7b2d26;
      color: #fff;
      display: inline-block;
      padding: 10px 16px;
      text-decoration: none;
    }
    a.site-button.alt {
      background: #3f5e52;
    }
    a.site-button:hover {
      filter: brightness(1.06);
    }
    .muted {
      color: #775f55;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <h1>Архив форумов «7 дней лета»</h1>
      <p>На этой странице собраны две read-only копии форумов.</p>
      <div class="grid">
        <section class="site-card">
          <h2>bl7dl.2x2forum.ru</h2>
          <p>Архив старого форума по модификации «7 дней лета».</p>
          <p><a class="site-button" href="bl7dl-2x2forum-ru/bl7dl.2x2forum.ru/index.html">Открыть архив</a></p>
        </section>
        <section class="site-card">
          <h2>7dneyleta.ru</h2>
          <p>Архив нового форума по модификации «7 дней лета».</p>
          <p><a class="site-button alt" href="7dneyleta-ru/7dneyleta.ru/index.html">Открыть архив</a></p>
        </section>
      </div>

    </div>
  </main>
</body>
</html>
